services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: securecoating-vision-api:gpu
    environment:
      SECURECOATING_HARDWARE_PROFILE: ${SECURECOATING_HARDWARE_PROFILE:-performance}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
