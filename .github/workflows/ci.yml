name: SecureCoating Vision CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECURECOATING_ENV: test
      SECURECOATING_ALLOW_UNAUTHENTICATED_DEMO: "true"
      SECURECOATING_ENABLE_SENSOR_SIMULATION: "true"
      SECURECOATING_INDUSTRIAL_MOCK_MODE: "true"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Compile Python sources
        run: python -m compileall -q src dashboard scripts tests

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q -ra --junitxml=test-results.xml

      - name: Reject failures and unexplained skips
        run: python scripts/check_ci_junit.py test-results.xml

      - name: Validate Compose configuration
        run: docker compose config

      - name: Audit dependencies
        run: python -m pip install pip-audit && pip-audit -r requirements-lock.txt
