# SecureCoating-Vision: Model Configuration
#
# The YOLO/ONNX detector consumes RGB only.
# Thermal and profilometry are auxiliary simulated/injected adapters used by the
# fusion/failsafe path — they are NOT additional YOLO input channels.

model:
  name: "CoatingVision-YOLO26n-detect"
  version: "2.1.0-real-optical"
  backbone: "YOLO26n"
  pretrained: true
  num_classes: 3 # Runtime probability vector: [background, class 0, class 1]
  artifact_num_classes: 2
  class_names:
    0: "surface_crack"
    1: "delamination_crack"
  weights_path: "outputs/best.pt"
  onnx_path: "outputs/model.onnx"
  weights_sha256: "f72a8f2bd64add6f9ae6c42684bb09e0705b1ed70cdc9123bb82923ef76d5719"
  onnx_sha256: "fa1c467a5857bb68d226eb0b76c7ca4eeee1f94e0f710559401a5f223f8a1a14"

inputs:
  # Detector tensor channels (RGB YOLO/ONNX).
  rgb_channels:
    - name: "optical_r"
      source: "rgb_camera"
      index: 0
    - name: "optical_g"
      source: "rgb_camera"
      index: 1
    - name: "optical_b"
      source: "rgb_camera"
      index: 2
  dimensions:
    width: 1024
    height: 1024

# Auxiliary modalities used by sensor-fusion / failsafe contracts.
# These are not stacked into the YOLO/ONNX input tensor.
auxiliary_modalities:
  thermal:
    source: "lwir_camera"
    interface: "simulated_or_injected_adapter"
    yolo_input_channel: false
  profilometry:
    source: "laser_profiler"
    interface: "simulated_or_injected_adapter"
    yolo_input_channel: false
    field: "height"

inference:
  hardware_profile: "auto" # auto, edge, balanced, performance
  device: "auto" # backward-compatible override: auto, cuda, cpu
  precision: "fp32" # artifact baseline; active precision is runtime-reported
  imgsz: 512
  confidence_threshold: 0.35
  nms_threshold: 0.45

  # Quality grading thresholds
  grading:
    surface_crack:
      reject_any: true
    delamination_crack:
      reject_any: true
    scratch:
      max_allowable_length_mm: 5.0
    void:
      max_allowable_area_mm2: 2.0
    blister:
      max_allowable_height_um: 50.0
    delamination:
      max_allowable_area_mm2: 10.0

hardware_profiles:
  edge:
    imgsz: 512
    precision: "fp32"
    engine_priority: ["onnx", "yolo"]
  balanced:
    imgsz: 640
    precision: "fp32"
    engine_priority: ["onnx", "yolo"]
  performance:
    imgsz: 640
    precision: "fp16"
    engine_priority: ["yolo", "onnx"]
