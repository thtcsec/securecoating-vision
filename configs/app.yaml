# SecureCoating-Vision: Application Configuration

server:
  host: "0.0.0.0"
  port: 8000
  workers: 1 # Stateful roll and PLC components must remain in one process.
  debug: false

dashboard:
  host: "0.0.0.0"
  port: 8501
  theme: "dark"

inspection:
  # Measured local demo setting. At 43.25376 mm longitudinal FOV this requires
  # about 1.85 frames/s. It is not a factory throughput qualification.
  validated_demo_line_speed_m_s: 0.08

logging:
  level: "INFO" # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file_path: "logs/app.log"
  rotate_max_bytes: 10485760 # 10MB
  rotate_backup_count: 5

paths:
  data_dir: "data"
  output_dir: "outputs"
  reports_dir: "reports"
  db_path: "data/quality_history.db"

industrial_io:
  enabled: true
  mock_mode: true # Set to false in actual production with PLC connected
  # Exactly one protocol owns commands. The other may be used for read-only telemetry.
  command_channel: "opc_ua" # opc_ua | modbus
  ack_timeout_seconds: 0.75
  plc_ip: "192.168.1.100"
  opc_ua:
    endpoint: "opc.tcp://192.168.1.100:4840"
    node_id_reject: "ns=2;s=Device1.RejectGate"
    node_id_trigger: "ns=2;s=Device1.LineTrigger"
    node_id_hold: "ns=2;s=Device1.Hold"
    node_id_estop: "ns=2;s=Device1.EStop"
    node_id_command_sequence: "ns=2;s=Device1.CommandSequence"
    node_id_ack_sequence: "ns=2;s=Device1.AckSequence"
    security_policy: "Basic256Sha256"
    security_mode: "SignAndEncrypt"
    client_certificate: ""
    private_key: ""
    server_certificate: ""
  modbus:
    port: 502
    slave_id: 1
    register_reject: 1001
    register_estop: 1005
    register_hold: 1006
    register_command_sequence: 1010
    register_ack_sequence: 1011
    trusted_gateway: false
