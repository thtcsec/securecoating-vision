# OPTIONAL synthetic-only YOLO template for `src/training/train_yolo.py --allow-synthetic`.
# Do not treat this file as the competition training set.
#
# Real CoatingVision optical training/eval (Figshare DOI 10.6084/m9.figshare.29260121.v1,
# CC BY 4.0, seed 71, 2 classes) uses:
#   configs/coatingvision_real_detect.yaml
#   scripts/train_coatingvision_real.py
#   scripts/prepare_coatingvision_detection_dataset.py

path: data/coating_defects
train: images/train
val: images/val
test: images/test
nc: 4
names:
  0: scratch
  1: void
  2: blister
  3: delamination

metadata:
  description: "Optional synthetic coating-defect set for local trainer smoke tests"
  version: "1.0"
  source: "Synthetic development data only (train_yolo.py --allow-synthetic). Not CoatingVision. Not LIBAD."
  annotation_format: "YOLO segmentation (polygon masks)"
