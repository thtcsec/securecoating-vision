services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: securecoating-vision-api:latest
    container_name: coating_inspection_api
    ports:
      - "8000:8000"
    environment:
      - MODEL_CONFIG=configs/model.yaml
      - APP_CONFIG=configs/app.yaml
      - PYTHONPATH=/app
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
      - ./logs:/app/logs
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --workers 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - coating_net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: securecoating-vision-dashboard:latest
    container_name: coating_inspection_dashboard
    ports:
      - "8501:8501"
    environment:
      - MODEL_CONFIG=configs/model.yaml
      - APP_CONFIG=configs/app.yaml
      - PYTHONPATH=/app
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      api:
        condition: service_healthy
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - coating_net

networks:
  coating_net:
    driver: bridge
