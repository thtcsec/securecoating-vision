services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: securecoating-vision-api:latest
    container_name: coating_inspection_api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODEL_CONFIG: configs/model.yaml
      APP_CONFIG: configs/app.yaml
      CALIBRATION_CONFIG: configs/calibration.yaml
      PYTHONPATH: /app
      SECURECOATING_ENV: ${SECURECOATING_ENV:-production}
      SECURECOATING_API_KEY: ${SECURECOATING_API_KEY:-}
      SECURECOATING_FACTORY_SECRET: ${SECURECOATING_FACTORY_SECRET:-}
      SECURECOATING_OPERATOR_CREDENTIALS: ${SECURECOATING_OPERATOR_CREDENTIALS:-[]}
      SECURECOATING_DB_PATH: ${SECURECOATING_DB_PATH:-/app/data/quality_history.db}
      SECURECOATING_INFERENCE_DEVICE: "cpu"
      XDG_CONFIG_HOME: /tmp/.config
      YOLO_CONFIG_DIR: /tmp/Ultralytics
      MPLCONFIGDIR: /tmp/matplotlib
      SECURECOATING_DASHBOARD_SANDBOX: "false"
      SECURECOATING_ENABLE_SENSOR_SIMULATION: "false"
      SECURECOATING_INDUSTRIAL_MOCK_MODE: "false"
      SECURECOATING_ALLOWED_ORIGINS: ${SECURECOATING_ALLOWED_ORIGINS:-http://127.0.0.1:8501}
      SECURECOATING_TRUSTED_HOSTS: ${SECURECOATING_TRUSTED_HOSTS:-localhost,127.0.0.1,api}
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
      - ./logs:/app/logs
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --workers 1
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/live', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - coating_net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: securecoating-vision-dashboard:latest
    container_name: coating_inspection_dashboard
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      MODEL_CONFIG: configs/model.yaml
      APP_CONFIG: configs/app.yaml
      CALIBRATION_CONFIG: configs/calibration.yaml
      PYTHONPATH: /app
      SECURECOATING_ENV: ${SECURECOATING_ENV:-production}
      SECURECOATING_API_URL: http://api:8000
      SECURECOATING_API_KEY: ${SECURECOATING_API_KEY:-}
      SECURECOATING_FACTORY_SECRET: ${SECURECOATING_FACTORY_SECRET:-}
      SECURECOATING_OPERATOR_CREDENTIALS: ${SECURECOATING_OPERATOR_CREDENTIALS:-[]}
      SECURECOATING_INFERENCE_DEVICE: "cpu"
      SECURECOATING_DASHBOARD_SANDBOX: "false"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: "none"
      XDG_CONFIG_HOME: /tmp/.config
      YOLO_CONFIG_DIR: /tmp/Ultralytics
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      api:
        condition: service_healthy
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - coating_net

networks:
  coating_net:
    driver: bridge
